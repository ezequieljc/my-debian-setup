<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 0xProto Nerd Font como fonte monoespaçada padrão
     (usada pela barra, pelo menu e pelo xfce4-terminal). -->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer><family>0xProto Nerd Font</family></prefer>
  </alias>
</fontconfig>
